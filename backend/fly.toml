# Fly.io — região São Paulo (gru). Troque HYDRUS_APP pelo nome do app.
# Deploy: fly launch (gera este arquivo) ou fly deploy com este template.
app = "HYDRUS_APP"
primary_region = "gru"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "60s"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
